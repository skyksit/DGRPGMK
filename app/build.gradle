plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hatkid.mkxpz'
    compileSdk 33

    defaultConfig {
        applicationId "com.hatkid.mkxpz"
        // 29: dsam3 통합 타깃과 정렬 (네이티브도 android-29 로 빌드됨 — Application.mk)
        minSdk 29
        targetSdk 33
        versionCode 11
        versionName "0.1.1"
        archivesBaseName = "mkxp-z-$versionName"
        ndk.debugSymbolLevel = 'FULL'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            debuggable true
            jniDebuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            // You can build also 'x86' and 'x86_64' if you want (useful for AVD debugging)
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "jni/Android.mk"
        }
    }
    // r27+: APP_SUPPORT_FLEXIBLE_PAGE_SIZES (16KB 페이지) 지원 필수
    ndkVersion '27.2.12479018'
}

dependencies {
    implementation 'com.intuit.sdp:sdp-android:1.1.0'
}
